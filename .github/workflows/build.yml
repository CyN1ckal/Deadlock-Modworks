name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Configure
        shell: pwsh
        run: |
          foreach ($generator in @("Visual Studio 18 2026", "Visual Studio 17 2022")) {
            if (Test-Path build/release) { Remove-Item -Recurse -Force build/release }
            cmake -G $generator -A x64 -S . -B build/release
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw "No supported Visual Studio generator was found."
      - name: Build
        run: cmake --build build/release --config Release
      - name: Test
        shell: pwsh
        run: |
          .\build\release\bin\Release\skeleton_repair_tests.exe --gtest_brief=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\release\bin\Release\render_tests.exe --gtest_brief=1
          exit $LASTEXITCODE
      - name: Package
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DeadlockSkeletonRepair-win-x64
          path: dist/DeadlockSkeletonRepair-win-x64.zip
