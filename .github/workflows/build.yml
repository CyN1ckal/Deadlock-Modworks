name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install architecture-check dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) {
            throw "py -3 is required for scripts/architecture_diagram.py --check."
          }
          py -3 -m pip install --disable-pip-version-check networkx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -c "import networkx"
          if ($LASTEXITCODE -ne 0) { throw "networkx is not importable from py -3." }
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Configure
        shell: pwsh
        run: |
          foreach ($generator in @("Visual Studio 18 2026", "Visual Studio 17 2022")) {
            if (Test-Path build/release) { Remove-Item -Recurse -Force build/release }
            cmake -G $generator -A x64 -S . -B build/release
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw "No supported Visual Studio generator was found."
      - name: Build
        run: cmake --build build/release --config Release
      - name: Test
        shell: pwsh
        run: |
          # Hosted CI does not launch the Vulkan window. There is no GPU smoke job.
          # render_tests skips when no Vulkan 1.3 device exists. A skip is not a failure.
          ctest --test-dir build/release -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\release\bin\Release\skeleton_repair_tests.exe --gtest_brief=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\release\bin\Release\render_tests.exe --gtest_brief=1
          exit $LASTEXITCODE
      - name: Architecture check
        shell: pwsh
        run: py -3 scripts/architecture_diagram.py --check
      - name: Package
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DeadlockModworks-0.1.0-win-x64
          path: |
            dist/DeadlockModworks-0.1.0-win-x64.zip
            dist/DeadlockModworks-0.1.0-win-x64.zip.sha256
          if-no-files-found: error
