name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore DeadlockModelUpdater.slnx --locked-mode
      - run: dotnet build DeadlockModelUpdater.slnx --no-restore -c Release -m:1
      - run: dotnet run --project DeadlockModelUpdater.Tests -c Release --no-build
      - run: dotnet run --project DeadlockModelUpdater.Tests -c Release --no-build -- --ui-repair-smoke artifacts/ui-repair-smoke.png
      - shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DeadlockModelUpdater-win-x64
          path: dist/DeadlockModelUpdater-win-x64.zip

  cpp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          foreach ($generator in @("Visual Studio 18 2026", "Visual Studio 17 2022")) {
            if (Test-Path build/release) { Remove-Item -Recurse -Force build/release }
            cmake -G $generator -A x64 -S . -B build/release
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw "No supported Visual Studio generator was found."
      - name: Build
        run: cmake --build build/release --config Release
      - name: Test
        run: .\build\release\bin\Release\skeleton_repair_tests.exe --gtest_brief=1
